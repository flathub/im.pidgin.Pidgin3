app-id: im.pidgin.Pidgin3
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: pidgin3
finish-args:
  # X11 + XShm access
  - "--share=ipc"
  - "--socket=fallback-x11"
  # Wayland access
  - "--socket=wayland"
  # GPU acceleration if needed
  - "--device=dri"
  # Needs to talk to the network:
  - "--share=network"
  # Audio
  - "--socket=pulseaudio"
  # Accessibility
  - "--talk-name=org.a11y.Bus"
  # libsecret plugin
  - "--talk-name=org.freedesktop.secrets"
  # Bonjour
  - "--system-talk-name=org.freedesktop.Avahi"
  # Plugin Paths
  - "--env=PURPLE_PLUGIN_PATH=/app/plugins/purple-3"
  - "--env=PIDGIN_PLUGIN_PATH=/app/plugins/pidgin-3"

add-extensions:
  im.pidgin.Purple3.Plugin:
    directory: plugins
    add-ld-path: lib
    merge-dirs: purple-3
    no-autodownload: true
    autodelete: true
    subdirectories: true
  im.pidgin.Pidgin3.Plugin:
    directory: plugins
    add-ld-path: lib
    merge-dirs: pidgin-3
    no-autodownload: true
    autodelete: true
    subdirectories: true

modules:
  - name: qrencode
    buildsystem: autotools
    cleanup:
      - /lib/*.la
    config-opts:
      - "--disable-static"
    sources:
      - type: archive
        url: https://github.com/fukuchi/libqrencode/archive/refs/tags/v4.1.1.tar.gz
        sha256: 5385bc1b8c2f20f3b91d258bf8ccc8cf62023935df2d2676b5b67049f31a049c
  - name: birb
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/birb/0.11.0/birb-0.11.0.tar.xz
        sha256: 9366ee65d4a0e28da60955acc3618f63672e8f3f2229296f8af14d6459ca3741
  - name: hasl
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/hasl/0.6.0/hasl-0.6.0.tar.xz
        sha256: dd892e8ac5d61b64031e75a7001ecb8916b99ba4efc78c3cb123cd59a0c3bcbb
  - name: ibis
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/ibis/0.16.1/ibis-0.16.1.tar.xz
        sha256: cdd2db49f9acf60017a08b0771edce4693cf722a7aef65606d1324b2cb530e0d
  - name: xeme
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://keep.imfreedom.org/xeme/xeme/archive/5d0707ab10a2.tar.gz
        sha256: eabb0f88fdc54775e9aab63d277d0d0cf54c456ee09580d45bd516d1117088da
  - name: gplugin
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "-Dlua=false"
      - "-Dpython3=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/gplugin/0.44.2/gplugin-0.44.2.tar.xz
        sha256: aea244e1add9628b50ec042c54cf93803f4577f8f142678f09b91fd4c0b20f72
  - name: seagull
    buildsystem: meson
    config-opts:
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/seagull/0.8.2/seagull-0.8.2.tar.xz
        sha256: ad676236083858b3adab61eca836b4f49b847509a1b4c4626b404e5034e3a6ee
  - name: libspelling-1
    buildsystem: meson
    config-opts:
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.10.tar.xz
        sha256: 56e3f01a3a18b575beea4c34349f99cdaba316e1f7c271b1231f7bcf5d9af73b
  - name: pidgin3
    buildsystem: meson
    config-opts:
      - "-Ddoc=false"
      - "--wrap-mode=nofallback"
    sources:
      - type: archive
        archive-type: tar-xz
        url: https://fastly.imfreedom.org/Pidgin3/2.97.0/pidgin3-2.97.0.tar.xz
        sha256: 49fca398ead172d31bfe4efacd85a6b03916b3212104d2b1cc047654d69e6d1e
      - type: file
        path: im.pidgin.Pidgin3.metainfo.xml
    post-install:
      - install -d /app/plugins/pidgin-3
      - install -d /app/plugins/purple-3
      - install -Dm644 ../im.pidgin.Pidgin3.metainfo.xml /app/share/metainfo/im.pidgin.Pidgin3.metainfo.xml

